<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background panel matching #030305 -->
  <rect width="512" height="512" rx="100" fill="#030305"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Sleek Minimalist Geometric YSN Monogram -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Y -->
    <path d="M 120,130 L 195,225 L 195,370" stroke="#ffffff" stroke-width="26"/>
    <path d="M 270,130 L 195,225" stroke="#ffffff" stroke-width="26"/>

    <!-- S -->
    <path d="M 370,150 L 310,150 L 310,240 L 370,260 L 370,350 L 305,350" stroke="#6366f1" stroke-width="26"/>

    <!-- N -->
    <path d="M 405,370 L 405,130 L 470,370 L 470,130" stroke="#94a3b8" stroke-width="22"/>
  </g>

  <!-- Accent Status Pulse Dot -->
  <circle cx="195" cy="370" r="10" fill="#10b981"/>
</svg>
