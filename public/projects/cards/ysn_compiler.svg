<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad_ysn_compiler" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1219"/>
      <stop offset="50%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="accentGrad_ysn_compiler" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad_ysn_compiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)"/>
    </linearGradient>
    <pattern id="gridPattern_ysn_compiler" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad_ysn_compiler)"/>
  <rect width="800" height="500" rx="16" fill="url(#gridPattern_ysn_compiler)"/>

  <!-- Ambient Glow -->
  <circle cx="700" cy="100" r="180" fill="#8b5cf6" opacity="0.12"/>
  <circle cx="150" cy="400" r="150" fill="#ec4899" opacity="0.08"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Center Decorative Technical Canvas -->
  <rect x="40" y="40" width="720" height="280" rx="12" fill="url(#cardGrad_ysn_compiler)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Inner Canvas Graphic Elements -->
  <!-- Top Bar -->
  <circle cx="68" cy="65" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="84" cy="65" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="100" cy="65" r="5" fill="#10b981" opacity="0.8"/>
  <text x="130" y="69" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.05em">SYSTEM_SPEC :: YSN_COMPILER</text>

  <!-- Node & Vector Diagram -->
  <g transform="translate(60, 100)">
    <!-- Node Graph Lines -->
    <path d="M 50 130 C 180 30, 240 180, 420 80 S 580 140, 640 40" fill="none" stroke="url(#accentGrad_ysn_compiler)" stroke-width="3" opacity="0.9"/>
    <path d="M 50 70 C 150 160, 320 20, 480 130 S 560 60, 640 110" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>

    <!-- Nodes -->
    <circle cx="50" cy="130" r="7" fill="#0d1117" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="210" cy="100" r="5" fill="#0d1117" stroke="#ec4899" stroke-width="2"/>
    <circle cx="420" cy="80" r="9" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/>
    <circle cx="540" cy="115" r="6" fill="#0d1117" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="640" cy="40" r="8" fill="#ec4899" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Data metric tag on canvas -->
    <rect x="360" y="115" width="200" height="32" rx="6" fill="rgba(0, 0, 0, 0.75)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="372" y="136" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">x64 ASM</text>
  </g>

  <!-- Lower Meta Card -->
  <g transform="translate(48, 350)">
    <!-- Badge -->
    <rect x="0" y="0" width="248" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#8b5cf6"/>
    <text x="24" y="16" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.08em">x64 ASM · C++20 ARCHITECTURE</text>

    <!-- Project Title -->
    <text x="0" y="58" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em">YSN Compiler &amp; Bytecode VM</text>

    <!-- Description -->
    <text x="0" y="86" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400">Custom Lexer, Recursive-Descent AST &amp; x64 Native Code Generator</text>
  </g>
</svg>